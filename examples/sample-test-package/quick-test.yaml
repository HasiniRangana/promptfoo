# Simple Test Configuration for Quick Testing
# This is a minimal configuration to test the setup

description: "Quick test to verify Promptfoo setup"

prompts:
  - id: "hello-world"
    content: |
      You are a helpful assistant. Respond to this greeting: Hello!

providers:
  - id: "test-provider"
    file://custom-provider.js:
      config:
        id: "simple-test"

tests:
  - description: "Basic greeting test"
    vars: {}
    assert:
      - type: contains
        value: "Hello"
      - type: javascript
        value: "output.length > 5"

outputPath: './quick-test-results'