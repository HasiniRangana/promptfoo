# Sample Promptfoo Test Configuration
# This demonstrates various testing scenarios and features

description: "Sample Promptfoo Test Package - Demonstrates LLM testing capabilities"

# Define multiple prompts to test
prompts:
  - id: "basic-qa"
    content: |
      You are a helpful AI assistant. Answer the following question clearly and concisely.
      
      Question: {{question}}
      
      Answer:

  - id: "structured-response"
    content: |
      You are an AI assistant that provides structured responses in JSON format.
      
      Question: {{question}}
      
      Please respond with a JSON object containing:
      - "answer": your response to the question
      - "confidence": a number from 0-1 indicating your confidence
      - "category": the category of the question (e.g., "factual", "opinion", "technical")
      
      Response:

  - id: "creative-writing"
    content: |
      You are a creative writing assistant. Write a short {{content_type}} based on the following prompt:
      
      Prompt: {{writing_prompt}}
      
      Requirements:
      - Keep it under {{word_limit}} words
      - Make it {{tone}} in tone
      - Include the theme of {{theme}}
      
      {{content_type}}:

  - id: "code-generation"
    content: |
      You are a software developer. Generate {{language}} code for the following requirement:
      
      Requirement: {{requirement}}
      
      Please provide:
      1. Clean, well-commented code
      2. Follow best practices for {{language}}
      3. Include error handling where appropriate
      
      Code:

  - id: "data-analysis"
    content: |
      You are a data analyst. Analyze the following data and provide insights:
      
      Data: {{data}}
      Analysis Type: {{analysis_type}}
      
      Please provide:
      1. Key findings
      2. Trends or patterns
      3. Actionable recommendations
      
      Analysis:

# Define different LLM providers to compare
providers:
  # OpenAI models
  - id: "gpt-4o-mini"
    openai:gpt-4o-mini:
      config:
        temperature: 0.1
        max_tokens: 500

  - id: "gpt-4o"
    openai:gpt-4o:
      config:
        temperature: 0.1
        max_tokens: 500

  # Alternative: Add other providers as needed
  # - id: "claude-3-sonnet"
  #   anthropic:claude-3-sonnet-20240229:
  #     config:
  #       temperature: 0.1
  #       max_tokens: 500

# Define test cases
tests:
  # Basic Q&A Tests
  - description: "Basic factual questions"
    vars:
      question: "What is the capital of France?"
    assert:
      - type: contains
        value: "Paris"
      - type: not-contains
        value: ["London", "Berlin", "Madrid"]
      - type: javascript
        value: "output.length > 10 && output.length < 100"

  - description: "Mathematical reasoning"
    vars:
      question: "If a train travels 60 mph for 2.5 hours, how far does it travel?"
    assert:
      - type: contains
        value: "150"
      - type: icontains
        value: "miles"
      - type: javascript
        value: "!output.toLowerCase().includes('kilometers')"

  # Structured Response Tests
  - description: "JSON response format"
    vars:
      question: "What are the benefits of renewable energy?"
    prompts: ["structured-response"]
    assert:
      - type: is-json
      - type: javascript
        value: |
          const response = JSON.parse(output);
          return response.answer && 
                 typeof response.confidence === 'number' && 
                 response.confidence >= 0 && 
                 response.confidence <= 1 &&
                 response.category;

  # Creative Writing Tests
  - description: "Short story generation"
    vars:
      content_type: "story"
      writing_prompt: "A robot discovers emotions for the first time"
      word_limit: "200"
      tone: "optimistic"
      theme: "self-discovery"
    prompts: ["creative-writing"]
    assert:
      - type: javascript
        value: |
          const wordCount = output.split(/\s+/).length;
          return wordCount <= 220; // Allow slight buffer
      - type: icontains
        value: ["robot", "emotion"]
      - type: not-contains
        value: ["hate", "violence", "death"]

  # Code Generation Tests
  - description: "Python function generation"
    vars:
      language: "Python"
      requirement: "Create a function that calculates the factorial of a number"
    prompts: ["code-generation"]
    assert:
      - type: contains
        value: "def"
      - type: icontains
        value: "factorial"
      - type: javascript
        value: |
          return output.includes('return') && 
                 (output.includes('*') || output.includes('math.factorial'));

  - description: "JavaScript validation"
    vars:
      language: "JavaScript"
      requirement: "Create a function that validates an email address"
    prompts: ["code-generation"]
    assert:
      - type: contains
        value: "function"
      - type: icontains
        value: ["email", "@"]
      - type: javascript
        value: |
          return output.includes('return') && 
                 (output.includes('test') || output.includes('match') || output.includes('@'));

  # Data Analysis Tests
  - description: "Sales data analysis"
    vars:
      data: |
        Sales Data (Monthly):
        January: $45,000
        February: $52,000
        March: $48,000
        April: $61,000
        May: $58,000
        June: $67,000
      analysis_type: "trend analysis"
    prompts: ["data-analysis"]
    assert:
      - type: icontains
        value: ["trend", "increase", "growth"]
      - type: javascript
        value: |
          const output_lower = output.toLowerCase();
          return output_lower.includes('recommendation') || 
                 output_lower.includes('insight') ||
                 output_lower.includes('finding');

  # Edge Cases and Error Handling
  - description: "Empty input handling"
    vars:
      question: ""
    prompts: ["basic-qa"]
    assert:
      - type: javascript
        value: |
          return output.length > 10 && 
                 !output.toLowerCase().includes('error') &&
                 (output.toLowerCase().includes('please') || 
                  output.toLowerCase().includes('provide') ||
                  output.toLowerCase().includes('need'));

  - description: "Ambiguous question"
    vars:
      question: "What's the best?"
    prompts: ["basic-qa"]
    assert:
      - type: javascript
        value: |
          const output_lower = output.toLowerCase();
          return output_lower.includes('clarify') || 
                 output_lower.includes('specific') ||
                 output_lower.includes('context') ||
                 output_lower.includes('depends');

# Global test configuration
defaultTest:
  options:
    # Transform outputs for consistent testing
    transform: |
      // Remove extra whitespace and normalize
      output.trim().replace(/\s+/g, ' ')

# Output configuration
outputPath: './test-results'

# Evaluation settings
evaluateOptions:
  maxConcurrency: 3
  delay: 1000  # 1 second delay between requests
  
# Enable sharing (optional)
sharing:
  apiBaseUrl: https://app.promptfoo.dev
  
# Metadata
metadata:
  version: "1.0.0"
  author: "Promptfoo Test Suite"
  tags: ["sample", "demo", "comprehensive"]